<!DOCTYPE html>
<html>
<head>
<title>I2i Overseas Employment Portal</title>
<link rel="stylesheet" href="./style.css">
</head>

<body>

<div class="navbar">

<h3>I2i Overseas Employment</h3>

<button onclick="logout()" id="logoutBtn">Logout</button>

</div>

<h2>I2i Overseas Employment Application</h2>

<form id="applicationForm">

<label>Name</label><br>
<input id="name" type="text" required><br><br>

<label>Email</label><br>
<input id="email" type="email" required><br><br>

<label>Gender</label><br>
<select id="gender" required>
<option value="">Select Gender</option>
<option value="Male">Male</option>
<option value="Female">Female</option>
<option value="Other">Other</option>
</select><br><br>

<label>Phone Number</label><br>
<input id="phone" type="tel" pattern="[0-9]{10}" required><br><br>

<label>Country</label><br>
<input id="country" type="text" required><br><br>

<label>Job Role</label><br>
<select id="job_role" required onchange="checkOtherRole()">
<option value="">Select Job Role</option>
<option value="Mechanic">Mechanic</option>
<option value="Electrician">Electrician</option>
<option value="Driver">Driver</option>
<option value="Welder">Welder</option>
<option value="Construction Worker">Construction Worker</option>
<option value="Plumber">Plumber</option>
<option value="Other">Other</option>
</select>
<input id="other_job_role" type="text" placeholder="Enter your job role" style="display:none; margin-top:10px;"><br><br>

<button type="submit">Submit Application</button>

</form>

<p id="status"></p>

<script src="script.js"></script>
<script src="auth.js"></script>

</body>
</html>
